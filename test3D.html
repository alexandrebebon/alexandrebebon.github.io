<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Model Viewer</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 20px 0;
      text-align: center;
    }

    .viewer-container {
      width: 50vw;
      height: 50vh;
      border: 4px solid #30cfcf; /* bleu turquoise */
      box-sizing: border-box;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<h1>
  utilisation de "model-viewer" pour affichage d'un fichier .glb sur une page html
</h1>

<div class="viewer-container">
  <model-viewer
    src="test_glb2.glb"
    camera-controls
    auto-rotate>
  </model-viewer>
</div>

</body>
</html>
